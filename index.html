<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pennywise Soundboard</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --accent-red: #cc0000;
            --accent-glow: rgba(204, 0, 0, 0.4);
            --text-color: #f0f0f0;
            --text-muted: #888;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--accent-red);
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        p.instructions {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .soundboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1000px;
            padding-bottom: 40px;
        }

        .sound-btn {
            background-color: var(--card-bg);
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px 15px;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            min-height: 100px;
            position: relative;
            overflow: hidden;
            transition: all 0.15s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: left;
        }

        .sound-btn:hover {
            border-color: var(--accent-red);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px var(--accent-glow);
        }

        .sound-btn:active, .sound-btn.playing {
            background-color: #2b0505;
            border-color: var(--accent-red);
            transform: scale(0.97);
        }

        .sound-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            word-break: break-word;
            z-index: 2;
        }

        .key-badge {
            background-color: #333;
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 2;
            border: 1px solid #444;
        }

        .sound-btn.playing .key-badge {
            background-color: var(--accent-red);
            border-color: #ff1a1a;
        }

        /* Subtle active ripple / progress indicator */
        .sound-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background-color: var(--accent-red);
            transition: width linear;
        }

        .sound-btn.playing::after {
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Pennywise Soundboard</h1>
        <p class="instructions">Tap buttons or use your keyboard shortcuts (1-9, A-G)</p>
    </header>

    <div class="soundboard-grid" id="soundGrid"></div>

    <script>
        // List of all sound files located in PennywiseSounds folder
        const sounds = [
            { id: 1, name: "Do You Want A Balloon", file: "PennywiseSounds/do-you-want-a-ballon.mp3", key: "1" },
            { id: 2, name: "Ha Ha Ha 2", file: "PennywiseSounds/ha-ha-ha-2.mp3", key: "2" },
            { id: 3, name: "Ha Ha Ha 3", file: "PennywiseSounds/ha-ha-ha-3.mp3", key: "3" },
            { id: 4, name: "Hiya Georgie", file: "PennywiseSounds/hiya-georgie.mp3", key: "4" },
            { id: 5, name: "I Could Cheer Him Up", file: "PennywiseSounds/i-could-cheer-him-up.mp3", key: "5" },
            { id: 6, name: "I'll Give Him A Balloon", file: "PennywiseSounds/i-ll-give-him-a-balloon.mp3", key: "6" },
            { id: 7, name: "I'm Not Real Enough", file: "PennywiseSounds/i-m-not-real-enough-for-you.mp3", key: "7" },
            { id: 8, name: "Meet Pennywise Pt 1", file: "PennywiseSounds/meet-pennywise-pt1.mp3", key: "8" },
            { id: 9, name: "Pennywise 2", file: "PennywiseSounds/pennywise-2.mp3", key: "9" },
            { id: 10, name: "Hoohoohahaha", file: "PennywiseSounds/Pennywise-Hoohoohahaha.mp3", key: "a" },
            { id: 11, name: "Take It", file: "PennywiseSounds/take-it.mp3", key: "b" },
            { id: 12, name: "Time To Float", file: "PennywiseSounds/time-to-float.mp3", key: "c" },
            { id: 13, name: "The Dancing Clown", file: "PennywiseSounds/well-i-m-pennywise-the-dancing-clown.mp3", key: "d" },
            { id: 14, name: "Yes We Do", file: "PennywiseSounds/yes-we-do.mp3", key: "e" },
            { id: 15, name: "Yes", file: "PennywiseSounds/yes.mp3", key: "f" },
            { id: 16, name: "Live To Grow & Thrive", file: "PennywiseSounds/you-will-all-live-to-grow-and-thrive.mp3", key: "g" }
        ];

        const grid = document.getElementById('soundGrid');
        const audioElements = {};

        // Build the soundboard layout dynamically
        sounds.forEach(sound => {
            // Create Audio object
            const audio = new Audio(sound.file);
            audio.preload = 'auto';
            audioElements[sound.key.toLowerCase()] = { audio, sound };

            const btn = document.createElement('button');
            btn.className = 'sound-btn';
            btn.dataset.key = sound.key.toLowerCase();
            
            btn.innerHTML = `
                <span class="sound-title">${sound.name}</span>
                <span class="key-badge">Key: ${sound.key.toUpperCase()}</span>
            `;

            // Click / Tap handler
            btn.addEventListener('click', () => {
                playSound(sound.key.toLowerCase(), btn);
            });

            grid.appendChild(btn);
        });

        function playSound(key, btnElement) {
            const item = audioElements[key];
            if (!item) return;

            const { audio } = item;
            
            // Allow overlapping audio playback if clicked rapidly
            audio.currentTime = 0;
            
            // Set dynamic transition duration on the progress bar matching file duration if possible, default to 1s fallback
            const duration = isNaN(audio.duration) || audio.duration === Infinity ? 1 : audio.duration;
            btnElement.style.setProperty('--transition-duration', `${duration}s`);
            
            audio.play().catch(err => console.log("Audio playback error:", err));
            
            btnElement.classList.add('playing');
            
            // Remove animation class after playback or timeout
            setTimeout(() => {
                btnElement.classList.remove('playing');
            }, duration * 1000);
        }

        // Global Bluetooth Keyboard Listener
        window.addEventListener('keydown', (e) => {
            // Ignore if user is typing in an input field (just in case)
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            const key = e.key.toLowerCase();
            if (audioElements[key]) {
                const btnElement = document.querySelector(`[data-key="${key}"]`);
                playSound(key, btnElement);
            }
        });
    </script>
</body>
</html>
